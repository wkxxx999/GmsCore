name: Huawei FIDO2 debug APK

on:
  push:
    branches:
      - feature/huawei-fido2-credential-list
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  huawei-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Huawei debug variant
        run: ./gradlew :play-services-core:assembleHmsHuaweiDebug --stacktrace

      - name: Locate and stage Huawei APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t apks < <(find play-services-core/build/outputs/apk -type f -name '*.apk' -print0)
          printf 'APK files found: %s\n' "${#apks[@]}"
          printf '%s\n' "${apks[@]}"
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Huawei debug APK."
            exit 1
          fi
          mkdir -p upload
          cp -- "${apks[0]}" upload/
          sha256sum upload/*.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: microg-huawei-fido2-debug-test-only
          path: upload/*.apk
          if-no-files-found: error
          retention-days: 7
