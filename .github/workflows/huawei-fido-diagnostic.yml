name: Huawei passkey diagnostics APK

on:
  push:
    branches:
      - feature/huawei-fido2-credential-list
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone read-only diagnostics app
        run: |
          chmod +x ./gradlew
          ./gradlew :huawei-fido-diagnostic:assembleDebug --stacktrace
      - name: Locate and check diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          find huawei-fido-diagnostic/build/outputs/apk -type f -name '*.apk' -print
          test -f huawei-fido-diagnostic/build/outputs/apk/debug/huawei-fido-diagnostic-debug.apk
          sha256sum huawei-fido-diagnostic/build/outputs/apk/debug/huawei-fido-diagnostic-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: huawei-fido-diagnostic-read-only-apk
          path: huawei-fido-diagnostic/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
