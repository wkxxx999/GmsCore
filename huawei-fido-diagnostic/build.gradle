apply plugin: 'com.android.application'

android {
    namespace 'org.microg.fidodiagnostic'
    compileSdkVersion androidCompileSdk

    defaultConfig {
        applicationId 'org.microg.fidodiagnostic.v2'
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 2
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
